name = "github-discord-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_ORG = "Daedalus-Data-Labs-LLC"
# @Daedalus assistant: free Cloudflare model, and questions per person per day (UTC).
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_DAILY_LIMIT = "20"
# Used instead of Workers AI once the ANTHROPIC_API_KEY secret is set.
ANTHROPIC_MODEL = "claude-opus-5-5"

# Cloudflare Workers AI (free daily allowance) for the @Daedalus assistant.
[ai]
binding = "AI"

# Holds the always-on Discord connection. SQLite-backed so it runs on the free plan.
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayBot"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayBot"]

# Every 15 minutes: check for linked members who left the Discord server.
# Weekdays at 14:00 UTC (9am US Eastern in winter, 10am in summer): daily PR digest.
# Cron times are UTC. To move the digest, change the second entry and redeploy.
[triggers]
crons = ["*/15 * * * *", "0 14 * * 1-5"]

# Secrets, set with `npx wrangler secret put <NAME>` (see README.md):
#   GITHUB_WEBHOOK_SECRET, DISCORD_WEBHOOK_URL                       relay
#   DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN, DISCORD_GUILD_ID,
#   DISCORD_VERIFIED_ROLE_ID, DISCORD_ADMIN_WEBHOOK_URL,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET                           verify + leave alerts
#   GITHUB_TOKEN (optional, read-only)                               digest + @Daedalus: private repos, code search
#   ANTHROPIC_API_KEY (optional)                                     @Daedalus: use Claude instead of Workers AI

# GitHub login → Discord user ID roster (Cloudflare KV). The id isn't secret:
# it only works with Daedalus's Cloudflare account.
[[kv_namespaces]]
binding = "PEOPLE"
id = "b7cf6ce9e91041b6892ce84bd8d517c4"

  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <use href="#alpha" transform="translate(0 15)" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round" opacity=".18" filter="url(#soft)"/>
  <use href="#alpha" fill="url(#rim)" stroke="url(#rim)" stroke-width="12" stroke-linejoin="round" opacity=".85"/>
  <use href="#alpha" fill="url(#glass)"/>
  <use href="#alpha" fill="url(#shade)"/>
  <use href="#alpha" fill="url(#gloss)"/>
</svg>
